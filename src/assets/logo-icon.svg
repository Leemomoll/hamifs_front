<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    hamifs logo（纯图标版）· 用于侧栏 / 登录页 / favicon 等小尺寸场景
    · 与 src/assets/logo.svg 同源，去掉文字以保证 16~32px 下清晰
  -->
  <!-- 文件夹主体 -->
  <path fill="#165DFF" d="M8 24a6 6 0 0 1 6-6h11.2a4 4 0 0 1 3.2 1.6l3 4H50a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/>
  <!-- 双后端分割槽 -->
  <rect x="15" y="35" width="34" height="4" rx="2" fill="#ffffff" opacity=".92"/>
  <rect x="15" y="44" width="34" height="4" rx="2" fill="#36D399"/>
  <!-- 循环转换箭头：两段 120° 圆弧，中间留明显缺口 -->
  <g transform="translate(44 24)">
    <g fill="none" stroke="#36D399" stroke-width="3.2" stroke-linecap="round">
      <path d="M-5.2-3A6 6 0 0 1 4.6-3.86"/>
    </g>
    <g transform="translate(4.6 -3.86) rotate(50)">
      <path fill="#36D399" d="M-1.3-2.6L3.8 0L-1.3 2.6z"/>
    </g>
    <g transform="rotate(180)">
      <g fill="none" stroke="#36D399" stroke-width="3.2" stroke-linecap="round">
        <path d="M-5.2-3A6 6 0 0 1 4.6-3.86"/>
      </g>
      <g transform="translate(4.6 -3.86) rotate(50)">
        <path fill="#36D399" d="M-1.3-2.6L3.8 0L-1.3 2.6z"/>
      </g>
    </g>
  </g>
</svg>
